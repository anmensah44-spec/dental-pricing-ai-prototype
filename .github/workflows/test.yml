# Product vision, requirements, architecture direction and delivery leadership: Andrews Mensah.
name: Application validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run vendor
      - run: npm test
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/check_reproducibility.py
      - run: python scripts/check_enterprise.py
      - run: python scripts/train_model.py
      - run: python scripts/train_enterprise.py
      - run: python scripts/check_reproducibility.py
      - run: python scripts/check_enterprise.py
